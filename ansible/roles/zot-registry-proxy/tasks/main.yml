---
- name: Assert registry proxy domain is configured
  ansible.builtin.assert:
    that:
      - zot_registry_domain is defined
      - zot_registry_domain | trim | length > 0
      - zot_registry_private_ip is defined
      - zot_registry_private_ip | trim | length > 0
    fail_msg: "zot_registry_domain and zot_registry_private_ip are required."

- name: Install registry proxy packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - debian-archive-keyring
      - debian-keyring
      - gnupg
      - golang-go
      - ufw
    state: present
    update_cache: true

- name: Check local ansible .env exists for Caddy DNS credentials
  ansible.builtin.stat:
    path: "{{ zot_registry_caddy_env_file }}"
  delegate_to: localhost
  become: false
  register: zot_registry_caddy_env_file_stat

- name: Require ansible .env for Caddy DNS credentials
  ansible.builtin.assert:
    that:
      - zot_registry_caddy_env_file_stat.stat.exists
      - zot_registry_caddy_env_file_stat.stat.isreg
    fail_msg: "Create ansible/.env and set VERCEL_AUTH_API_TOKEN before deploying the registry proxy."

- name: Read ansible .env for Caddy DNS credentials
  ansible.builtin.set_fact:
    zot_registry_caddy_env_lines: "{{ lookup('ansible.builtin.file', zot_registry_caddy_env_file).splitlines() }}"
  no_log: true

- name: Parse ansible .env for Caddy DNS credentials
  ansible.builtin.set_fact:
    zot_registry_caddy_env: "{{ zot_registry_caddy_env | default({}) | combine({(item.split('=', 1)[0] | trim): (item.split('=', 1)[1] | trim | regex_replace('^\"(.*)\"$', '\\1') | regex_replace(\"^'(.*)'$\", '\\1'))}) }}"
  loop: "{{ zot_registry_caddy_env_lines }}"
  when: item is match('^\\s*[A-Za-z_][A-Za-z0-9_]*=')
  no_log: true

- name: Require Caddy DNS provider env values
  ansible.builtin.assert:
    that:
      - zot_registry_caddy_env[item] is defined
      - zot_registry_caddy_env[item] | string | trim | length > 0
    fail_msg: "Required value {{ item }} is missing from ansible/.env."
  loop: "{{ zot_registry_caddy_required_env }}"
  no_log: true

- name: Resolve registry domain to private address locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "(^|\\s){{ zot_registry_domain | regex_escape }}(\\s|$)"
    line: "{{ zot_registry_private_ip }} {{ zot_registry_domain }} registry"
    owner: root
    group: root
    mode: "0644"

- name: Install Caddy apt key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Install Caddy apt source
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
    dest: /etc/apt/sources.list.d/caddy-stable.list
    owner: root
    group: root
    mode: "0644"

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Install xcaddy
  ansible.builtin.command: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
  environment:
    GOBIN: /usr/local/bin
  args:
    creates: /usr/local/bin/xcaddy

- name: Check installed Caddy modules
  ansible.builtin.command: "{{ zot_registry_caddy_custom_binary }} list-modules"
  register: zot_registry_caddy_modules
  changed_when: false
  failed_when: false

- name: Build Caddy with Vercel DNS module
  ansible.builtin.command: "/usr/local/bin/xcaddy build {{ zot_registry_caddy_version }} --with {{ zot_registry_caddy_module }} --output {{ zot_registry_caddy_custom_binary }}"
  when: zot_registry_caddy_modules.rc != 0 or 'dns.providers.vercel' not in zot_registry_caddy_modules.stdout
  notify: Reload registry caddy

- name: Ensure Caddy custom binary is executable
  ansible.builtin.file:
    path: "{{ zot_registry_caddy_custom_binary }}"
    owner: root
    group: root
    mode: "0755"

- name: Render Zot upstream config
  ansible.builtin.copy:
    dest: "{{ zot_registry_config_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "distSpecVersion": "1.1.1",
        "storage": {
          "rootDirectory": "{{ zot_registry_storage_root }}",
          "dedupe": true,
          "gc": true,
          "gcDelay": "1h",
          "gcInterval": "24h",
          "commit": true
        },
        "http": {
          "address": "{{ zot_registry_upstream_addr }}",
          "port": "{{ zot_registry_upstream_port }}"
        },
        "log": {
          "level": "info"
        }
      }
  notify: Restart zot

- name: Flush Zot restart before validating proxy
  ansible.builtin.meta: flush_handlers

- name: Install Caddy systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Caddy environment file
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/10-hivy-registry-env.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart={{ zot_registry_caddy_custom_binary }} run --config {{ zot_registry_caddy_config_path }}
      ExecReload=
      ExecReload={{ zot_registry_caddy_custom_binary }} reload --config {{ zot_registry_caddy_config_path }} --force
      Environment=VERCEL_AUTH_API_TOKEN={{ zot_registry_caddy_env.VERCEL_AUTH_API_TOKEN }}
  no_log: true

- name: Render registry Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ zot_registry_caddy_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload registry caddy

- name: Validate registry Caddyfile
  ansible.builtin.command: "{{ zot_registry_caddy_custom_binary }} validate --config {{ zot_registry_caddy_config_path }}"
  environment:
    VERCEL_AUTH_API_TOKEN: "{{ zot_registry_caddy_env.VERCEL_AUTH_API_TOKEN }}"
  changed_when: false

- name: Allow private registry TLS through UFW
  ansible.builtin.command: "ufw allow from 10.80.0.0/16 to any port {{ zot_registry_tls_port }} proto tcp"
  register: zot_registry_ufw
  changed_when: "'Rule added' in zot_registry_ufw.stdout"

- name: Enable and start registry Caddy
  ansible.builtin.systemd:
    name: "{{ zot_registry_caddy_service_name }}"
    enabled: true
    state: restarted
    daemon_reload: true

- name: Flush Caddy reload before health check
  ansible.builtin.meta: flush_handlers

- name: Verify registry proxy health
  ansible.builtin.uri:
    url: "https://{{ zot_registry_domain }}:{{ zot_registry_tls_port }}/v2/"
    method: GET
    status_code: 200
  register: zot_registry_proxy_health
  until: zot_registry_proxy_health.status == 200
  retries: 12
  delay: 5
