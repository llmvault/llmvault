---
runner_api_port: 8081
runner_cpu_overcommit: 1.5
runner_memory_overcommit: 1
runner_disk_overcommit: 1
runner_preview_port_range_start: 30000
runner_preview_port_range_end: 60999

microsandbox_binary_remote_path: /usr/local/bin/microsandbox
microsandbox_env_file: "{{ playbook_dir }}/../.env"
microsandbox_runner_addr: "127.0.0.1:{{ runner_api_port }}"
microsandbox_runner_env_path: /etc/hivy/microsandbox-runner.env
microsandbox_runner_service_name: microsandbox-runner
microsandbox_runner_backend: microsandbox
microsandbox_required_env:
  - HIVY_MICROSANDBOX_CONTROL_URL
  - HIVY_MICROSANDBOX_RUNNER_JOIN_SECRET
  - HIVY_MICROSANDBOX_RUNNER_API_TOKEN
