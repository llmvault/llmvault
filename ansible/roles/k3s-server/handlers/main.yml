---
# Do not restart the nftables service here. Its stop action flushes the complete
# ruleset, including rules installed by Cilium and other Kubernetes components.
- name: Reload Hivy nftables rules
  ansible.builtin.command: nft -f /etc/nftables.conf

- name: Restart K3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
