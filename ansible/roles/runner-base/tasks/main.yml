---
- name: Assert runner OS is Ubuntu 26.04 amd64
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("26.04", "==")
      - ansible_architecture == "x86_64"
    fail_msg: "Microsandbox runners currently target Ubuntu 26.04 on linux/amd64 only."

- name: Install base packages
  ansible.builtin.apt:
    name:
      - bash
      - ca-certificates
      - curl
      - jq
      - lsof
      - procps
      - runc
      - tar
      - ufw
      - unzip
    state: present
    update_cache: true

- name: Verify KVM device exists
  ansible.builtin.stat:
    path: /dev/kvm
  register: microsandbox_kvm_device

- name: Require KVM for Microsandbox
  ansible.builtin.assert:
    that:
      - microsandbox_kvm_device.stat.exists
    fail_msg: "/dev/kvm is missing. Enable hardware virtualization for this runner before continuing."

- name: Install Microsandbox with official installer when missing
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v msb >/dev/null 2>&1 || [ -x /root/.microsandbox/bin/msb ]; then
      echo "present"
    else
      curl -fsSL https://get.microsandbox.dev | sh
      echo "installed"
    fi
  args:
    executable: /bin/bash
  register: microsandbox_install_result
  changed_when: "'installed' in microsandbox_install_result.stdout"

- name: Install Microsandbox CLI symlink
  ansible.builtin.file:
    src: /root/.microsandbox/bin/msb
    dest: /usr/local/bin/msb
    state: link
    owner: root
    group: root

- name: Verify Microsandbox CLI is available
  ansible.builtin.command: msb --version
  register: microsandbox_cli_version
  changed_when: false

- name: Resolve registry domain to private address
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "(^|\\s){{ zot_registry_domain | regex_escape }}(\\s|$)"
    line: "{{ zot_registry_private_ip }} {{ zot_registry_domain }} registry"
    owner: root
    group: root
    mode: "0644"

- name: Remove obsolete private registry CA certificate
  ansible.builtin.file:
    path: /usr/local/share/ca-certificates/hivy-zot-registry.crt
    state: absent
  register: hivy_zot_registry_ca_removed

- name: Refresh system CA certificates after obsolete CA removal
  ansible.builtin.command: update-ca-certificates
  when: hivy_zot_registry_ca_removed.changed

- name: Install BuildKit binaries
  ansible.builtin.unarchive:
    src: "https://github.com/moby/buildkit/releases/download/{{ buildkit_version }}/buildkit-{{ buildkit_version }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/bin/buildctl

- name: Create BuildKit config directory
  ansible.builtin.file:
    path: /etc/buildkit
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure BuildKit private registry
  ansible.builtin.copy:
    dest: /etc/buildkit/buildkitd.toml
    owner: root
    group: root
    mode: "0644"
    content: |
      # The Hivy private registry uses a public ACME certificate on
      # {{ buildkit_registry }} and /etc/hosts routes that name to the private
      # registry address on runner hosts. BuildKit does not need a custom
      # insecure registry transport.
  notify: Restart buildkit

- name: Remove obsolete containers/image private registry config
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d/10-hivy-private-registry.conf
    state: absent

- name: Install BuildKit systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/buildkit.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=BuildKit daemon
      Documentation=https://github.com/moby/buildkit
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/buildkitd --config /etc/buildkit/buildkitd.toml
      Restart=always
      RestartSec=3
      LimitNOFILE=1048576
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target
  notify: Restart buildkit

- name: Enable and start BuildKit
  ansible.builtin.systemd:
    name: buildkit
    enabled: true
    state: started
    daemon_reload: true

- name: Verify BuildKit client is available
  ansible.builtin.command: buildctl --version
  register: buildkit_client_version
  changed_when: false

- name: Create Hivy config directory
  ansible.builtin.file:
    path: /etc/hivy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow SSH through UFW
  ansible.builtin.command: "ufw allow {{ ansible_port | default(22) }}/tcp"
  register: microsandbox_ufw_ssh
  changed_when: "'Rule added' in microsandbox_ufw_ssh.stdout"

- name: Allow HTTP through UFW for runner Caddy
  ansible.builtin.command: ufw allow 80/tcp
  register: microsandbox_ufw_http
  changed_when: "'Rule added' in microsandbox_ufw_http.stdout"

- name: Allow HTTPS through UFW for runner Caddy
  ansible.builtin.command: ufw allow 443/tcp
  register: microsandbox_ufw_https
  changed_when: "'Rule added' in microsandbox_ufw_https.stdout"

- name: Remove old public Microsandbox runner API UFW rule
  ansible.builtin.command: "ufw delete allow {{ runner_api_port }}/tcp"
  register: microsandbox_ufw_api_delete
  changed_when: "'Rule deleted' in microsandbox_ufw_api_delete.stdout"
  failed_when: false

- name: Allow the Kubernetes node to call the private runner API
  ansible.builtin.command: "ufw allow from {{ microsandbox_control_private_ip }} to any port {{ runner_api_port }} proto tcp"
  register: microsandbox_ufw_private_api
  changed_when: "'Rule added' in microsandbox_ufw_private_api.stdout"

- name: Remove preview host port access for retired proxies
  ansible.builtin.command: "ufw delete allow from {{ item }} to any port {{ runner_preview_port_range_start }}:{{ runner_preview_port_range_end }} proto tcp"
  loop: "{{ runner_preview_retired_sources }}"
  register: microsandbox_ufw_retired_preview
  changed_when: "'Rule deleted' in microsandbox_ufw_retired_preview.stdout"
  failed_when: false

- name: Allow preview host ports from preview proxies through UFW
  ansible.builtin.command: "ufw allow from {{ item }} to any port {{ runner_preview_port_range_start }}:{{ runner_preview_port_range_end }} proto tcp"
  loop: "{{ runner_preview_allowed_sources }}"
  register: microsandbox_ufw_preview
  changed_when: "'Rule added' in microsandbox_ufw_preview.stdout"

- name: Deny inbound traffic by default
  ansible.builtin.command: ufw default deny incoming
  register: microsandbox_ufw_incoming
  changed_when: "'Default incoming policy changed' in microsandbox_ufw_incoming.stdout"

- name: Allow outbound traffic by default
  ansible.builtin.command: ufw default allow outgoing
  register: microsandbox_ufw_outgoing
  changed_when: "'Default outgoing policy changed' in microsandbox_ufw_outgoing.stdout"

- name: Enable UFW
  ansible.builtin.command: ufw --force enable
  register: microsandbox_ufw_enable
  changed_when: "'Firewall is active and enabled' in microsandbox_ufw_enable.stdout"
