---
microsandbox_preview_cache_env_file: "{{ playbook_dir }}/../.env"
microsandbox_preview_cache_install_dir: /usr/local/lib/hivy
microsandbox_gateway_project_src: "{{ playbook_dir }}/../../services/microsandbox-gateway"
microsandbox_gateway_install_dir: /usr/local/lib/hivy/microsandbox-gateway
microsandbox_gateway_venv_path: /opt/hivy/microsandbox-gateway-venv
microsandbox_preview_cache_env_path: /etc/hivy/microsandbox-preview-cache.env
microsandbox_preview_cache_service_name: microsandbox-preview-cache
microsandbox_preview_cache_addr: 127.0.0.1
microsandbox_preview_cache_port: 8091
microsandbox_preview_cache_redis_url: redis://127.0.0.1:6379/0
microsandbox_preview_cache_required_env:
  - HIVY_MICROSANDBOX_PREVIEW_CACHE_TOKEN
  - HIVY_MICROSANDBOX_CONTROL_URL
  - HIVY_MICROSANDBOX_CONTROL_API_TOKEN
