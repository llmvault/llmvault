---
k3s_version: "v1.35.6+k3s1"
k3s_binary_checksum: "sha256:2b52a2c1ca6eb502e2a0ffa1a4cf79eef94875926577c1e43347ed292cc92432"

k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_private_network_cidr: "10.80.0.0/16"
k3s_bind_address: "{{ k3s_node_ip }}"
k3s_bootstrap_host: k8s0
k3s_bootstrap_server_url: "https://{{ hostvars[k3s_bootstrap_host].k3s_node_ip }}:6443"
k3s_local_config_root: "{{ inventory_dir }}/../../kubernetes/config"
k3s_bootstrap_token_path: "{{ k3s_local_config_root }}/credentials/k3s/{{ k3s_bootstrap_host }}/server-token"

k3s_configure_vswitch: true
k3s_public_interface: enp0s31f6
k3s_vswitch_vlan_id: 4000
k3s_vswitch_mtu: 1400
k3s_vswitch_prefix: 24
k3s_vswitch_route_cidr: "10.80.0.0/16"
k3s_vswitch_gateway: 10.80.1.1

# Hetzner Load Balancer k8s-public-ingress (ID 7249812). Only this private
# address may reach the host-network Gateway listeners.
k3s_load_balancer_private_ip: "10.80.0.4"
k3s_gateway_http_port: 10080
k3s_gateway_https_port: 10443
k3s_private_gateway_https_port: 443
k3s_private_registry_node_port: 32500
k3s_private_registry_clients:
  - 10.80.1.2
  - 10.80.1.3

# The Microsandbox control plane is private. Only the runner nodes may enter
# its Cilium NodePort.
k3s_microsandbox_control_node_port: 32080
k3s_microsandbox_control_clients:
  - 10.80.1.2
  - 10.80.1.3

k3s_etcd_snapshot_schedule: "0 */6 * * *"
k3s_etcd_snapshot_retention: 14
k3s_etcd_s3_enabled: true
k3s_etcd_s3_config_secret: k3s-etcd-s3

k3s_system_reserved: "cpu=1000m,memory=2Gi,ephemeral-storage=5Gi"
k3s_kube_reserved: "cpu=1000m,memory=2Gi,ephemeral-storage=5Gi"

# Public keys for GitHub Actions deployment tunnels. Each account is restricted
# to local TCP forwarding into the Kubernetes API and has no interactive shell.
k3s_deploy_tunnel_accounts:
  - name: hivy-deploy-staging
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOu8MvS467LVqnLrkkpUvxSdIouQ4nRSb0VX2TZ3N29F"
  - name: hivy-deploy-production
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAUglWsTVoJwimV+M3svIfhad0TT8q+PzYrpoUZsYQk+"
