---
runner_api_port: 8081
runner_cpu_overcommit: 3
runner_memory_overcommit: 2
runner_disk_overcommit: 4
runner_preview_port_range_start: 30000
runner_preview_port_range_end: 60999
runner_coredns_private_names:
  - api.usehivy.com
  - staging.api.usehivy.com
runner_sandbox_private_egress_cidr: "{{ runner_private_ip }}/32"
runner_sandbox_private_egress_ports: "443"
runner_haproxy_backend_group: k3s_ingress
runner_kubernetes_private_cidr: 10.80.1.0/24
runner_firewall_retired_sources:
  - 10.80.0.2
  - 10.80.1.4
zot_registry_domain: registry.usehivy.com
zot_registry_private_ip: "{{ runner_private_ip }}"
buildkit_registry: "{{ zot_registry_domain }}:5000"

microsandbox_binary_local_path: "{{ playbook_dir }}/../../dist/microsandbox-linux-amd64"
microsandbox_binary_remote_path: /usr/local/bin/microsandbox
microsandbox_env_file: "{{ playbook_dir }}/../.env"
microsandbox_runner_addr: "{{ runner_private_ip }}:{{ runner_api_port }}"
microsandbox_runner_env_path: /etc/hivy/microsandbox-runner.env
microsandbox_runner_service_name: microsandbox-runner
microsandbox_runner_backend: microsandbox
microsandbox_required_env:
  - HIVY_MICROSANDBOX_CONTROL_URL
  - HIVY_MICROSANDBOX_RUNNER_JOIN_SECRET
  - HIVY_MICROSANDBOX_RUNNER_API_TOKEN
