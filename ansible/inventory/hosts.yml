all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/usehivy

  children:
    k3s_servers:
      hosts:
        k8s0:
          ansible_host: 95.216.118.156
          k3s_node_name: k8s-0
          k3s_node_ip: 10.80.1.4
          k3s_private_interface: enp0s31f6.4000

    # This group is the single source of truth for nodes that accept private
    # Gateway traffic. Adding a node here labels it for Cilium ingress and
    # adds it to every runner's HAProxy backend pool.
    k3s_ingress:
      hosts:
        k8s0:

    runners:
      hosts:
        runner0:
          ansible_host: 135.181.238.109
          runner_name: 0-runner-sandboxes-hivy-com
          runner_private_ip: 10.80.1.2
          runner_public_url: http://10.80.1.2:8081
          runner_preview_base_url: http://10.80.1.2

        runner1:
          ansible_host: 157.180.98.55
          runner_name: 1-runner-sandboxes-hivy-com
          runner_private_ip: 10.80.1.3
          runner_public_url: http://10.80.1.3:8081
          runner_preview_base_url: http://10.80.1.3

    registry:
      hosts:
        zot-registry:
          ansible_host: 157.180.117.84
          zot_registry_private_ip: 10.80.0.3
