all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/usehivy

  children:
    k3s_servers:
      hosts:
        k8s0:
          ansible_host: 95.217.38.240
          k3s_node_name: k8s-0
          k3s_node_ip: 10.80.1.4
          k3s_private_interface: eno1.4000

    # This group is the single source of truth for nodes that accept private
    # Gateway traffic. Adding a node here labels it for Cilium ingress and
    # adds it to every runner's HAProxy backend pool.
    k3s_ingress:
      hosts:
        k8s0:

    runners:
      hosts:
        runner0:
          ansible_host: 65.21.216.179
          runner_name: 0-runner-sandboxes-hivy-com
          runner_private_ip: 10.80.1.2
          runner_public_interface: enp41s0
          runner_private_interface: enp41s0.4000
          runner_public_url: http://10.80.1.2:8081
          runner_preview_base_url: http://10.80.1.2
