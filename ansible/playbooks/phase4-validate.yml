---
- name: Validate Microsandbox runners
  hosts: runners
  become: true
  gather_facts: false
  tasks:
    - name: Validate runner service and health endpoints
      block:
        - name: Check systemd service is active
          ansible.builtin.command: "systemctl is-active {{ microsandbox_runner_service_name | default('microsandbox-runner') }}"
          register: microsandbox_service_status
          changed_when: false

        - name: Check local runner health
          ansible.builtin.uri:
            url: "http://{{ runner_private_ip }}:{{ runner_api_port | default(8081) }}/health"
            method: GET
            return_content: true
            status_code: 200
            timeout: 10
          register: microsandbox_local_health

        - name: Check configured private runner URL from runner
          ansible.builtin.uri:
            url: "{{ runner_public_url | trim | regex_replace('/+$', '') }}/health"
            method: GET
            return_content: true
            status_code: 200
            timeout: 15
          register: microsandbox_configured_health

        - name: Verify runner API port is not publicly reachable
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: "{{ runner_api_port | default(8081) }}"
            timeout: 3
            state: stopped
          delegate_to: localhost
          become: false

        - name: Print validation result
          ansible.builtin.debug:
            msg:
              - "Runner {{ runner_name }} is active."
              - "Local health: {{ microsandbox_local_health.content | default('') | trim }}"
              - "Configured private health: {{ microsandbox_configured_health.content | default('') | trim }}"

      rescue:
        - name: Print runner journal tail
          ansible.builtin.command: "journalctl -u {{ microsandbox_runner_service_name | default('microsandbox-runner') }} -n 120 --no-pager"
          register: microsandbox_runner_journal
          changed_when: false
          failed_when: false

        - name: Show runner diagnostics
          ansible.builtin.debug:
            msg:
              - "Microsandbox runner validation failed on {{ inventory_hostname }}."
              - "{{ microsandbox_runner_journal.stdout | default('No journal output') }}"

        - name: Fail validation phase
          ansible.builtin.fail:
            msg: "Microsandbox runner validation failed on {{ inventory_hostname }}."
