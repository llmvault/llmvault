---
- name: Validate Microsandbox runners
  hosts: runners
  become: true
  gather_facts: false
  tasks:
    - name: Validate runner service and health endpoints
      block:
        - name: Check systemd service is active
          ansible.builtin.command: "systemctl is-active {{ microsandbox_runner_service_name | default('microsandbox-runner') }}"
          register: microsandbox_service_status
          changed_when: false

        - name: Check runner observability services are active
          ansible.builtin.command: "systemctl is-active {{ item }}"
          changed_when: false
          loop:
            - hivy-node-exporter
            - hivy-vlagent
            - hivy-vmagent
            - systemd-journal-upload

        - name: Check local runner health
          ansible.builtin.uri:
            url: "http://{{ runner_private_ip }}:{{ runner_api_port | default(8081) }}/health"
            method: GET
            return_content: true
            status_code: 200
            timeout: 10
          register: microsandbox_local_health

        - name: Check configured private runner URL from runner
          ansible.builtin.uri:
            url: "{{ runner_public_url | trim | regex_replace('/+$', '') }}/health"
            method: GET
            return_content: true
            status_code: 200
            timeout: 15
          register: microsandbox_configured_health

        - name: Check authenticated sandbox log receiver health
          ansible.builtin.uri:
            url: "http://{{ runner_private_ip }}:{{ runner_log_ingest_port | default(9430) }}/health"
            method: GET
            return_content: true
            status_code: 200
            timeout: 10
          register: runner_log_ingest_health

        - name: Check local telemetry agent health
          ansible.builtin.uri:
            url: "{{ item }}"
            method: GET
            status_code: 200
            timeout: 10
          loop:
            - http://127.0.0.1:9100/metrics
            - http://127.0.0.1:9429/health
            - http://127.0.0.1:8429/health

        - name: Read runner firewall status
          ansible.builtin.command: ufw status
          register: microsandbox_ufw_status
          changed_when: false

        - name: Require subnet-wide Kubernetes runner access rules
          ansible.builtin.assert:
            that:
              - microsandbox_ufw_status.stdout_lines | select('search', '^' ~ runner_api_port ~ '/tcp') | select('search', 'ALLOW') | select('search', runner_kubernetes_private_cidr | regex_escape) | list | length == 1
              - microsandbox_ufw_status.stdout_lines | select('search', '^' ~ runner_preview_port_range_start ~ ':' ~ runner_preview_port_range_end ~ '/tcp') | select('search', 'ALLOW') | select('search', runner_kubernetes_private_cidr | regex_escape) | list | length == 1
              - microsandbox_ufw_status.stdout_lines | select('search', (runner_private_ip ~ ' ' ~ runner_log_ingest_port ~ '/tcp') | regex_escape) | select('search', 'ALLOW') | select('search', runner_sandbox_guest_cidr | regex_escape) | list | length == 1
            fail_msg: "Runner firewall does not allow the complete Kubernetes vSwitch subnet."

        - name: Verify every Kubernetes server can reach the runner API
          ansible.builtin.uri:
            url: "http://{{ runner_private_ip }}:{{ runner_api_port }}/health"
            method: GET
            status_code: 200
            timeout: 10
          delegate_to: "{{ item }}"
          loop: "{{ groups['k3s_servers'] }}"
          loop_control:
            label: "{{ item }} -> {{ inventory_hostname }}"

        - name: Verify runner API port is not publicly reachable
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: "{{ runner_api_port | default(8081) }}"
            timeout: 3
            state: stopped
          delegate_to: localhost
          become: false

        - name: Print validation result
          ansible.builtin.debug:
            msg:
              - "Runner {{ runner_name }} is active."
              - "Local health: {{ microsandbox_local_health.content | default('') | trim }}"
              - "Configured private health: {{ microsandbox_configured_health.content | default('') | trim }}"
              - "Sandbox log receiver: {{ runner_log_ingest_health.content | default('') | trim }}"

      rescue:
        - name: Print runner journal tail
          ansible.builtin.command: "journalctl -u {{ microsandbox_runner_service_name | default('microsandbox-runner') }} -n 120 --no-pager"
          register: microsandbox_runner_journal
          changed_when: false
          failed_when: false

        - name: Show runner diagnostics
          ansible.builtin.debug:
            msg:
              - "Microsandbox runner validation failed on {{ inventory_hostname }}."
              - "{{ microsandbox_runner_journal.stdout | default('No journal output') }}"

        - name: Fail validation phase
          ansible.builtin.fail:
            msg: "Microsandbox runner validation failed on {{ inventory_hostname }}."
