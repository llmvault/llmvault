---
- name: Validate the production K3s server
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Check the K3s systemd service
      ansible.builtin.command: systemctl is-active k3s
      changed_when: false

    - name: Wait for the Kubernetes API on the private address
      ansible.builtin.wait_for:
        host: "{{ k3s_node_ip }}"
        port: 6443
        timeout: 60

    - name: Read node status
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: k3s_node_status
      changed_when: false

    - name: Read embedded etcd status
      ansible.builtin.command: /usr/local/bin/k3s etcd-snapshot list
      register: k3s_snapshot_status
      changed_when: false

    - name: Read the K3s Pod resolver nameserver count
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          grep -Ec '^[[:space:]]*nameserver[[:space:]]+' {{ k3s_resolv_conf_path | quote }}
        executable: /bin/bash
      register: k3s_resolver_nameserver_count
      changed_when: false

    - name: Validate the K3s Pod resolver nameserver count
      ansible.builtin.assert:
        that:
          - k3s_resolver_nameserver_count.stdout | int > 0
          - k3s_resolver_nameserver_count.stdout | int <= 3
        fail_msg: "K3s Pod DNS must use between one and three upstream nameservers."

    - name: Show validation status
      ansible.builtin.debug:
        msg:
          - "{{ k3s_node_status.stdout }}"
          - "Embedded etcd snapshot command succeeded."
          - "K3s Pod resolver uses {{ k3s_resolver_nameserver_count.stdout }} upstream nameservers."
