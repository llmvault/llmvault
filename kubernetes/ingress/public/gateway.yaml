apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress-public
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 10080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 10443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: preview-usehivy-tls
    # Cluster Pods enter through this listener's ClusterIP Service, while
    # private-network hosts enter through the K3s node address. Neither path
    # traverses the Hetzner load balancer.
    - name: private-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: preview-usehivy-tls
