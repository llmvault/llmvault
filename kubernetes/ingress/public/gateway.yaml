apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress-public
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 10080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 10443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: preview-usehivy-tls
    # Cluster Pods enter through the private preview HAProxy bridge, which
    # prepends the PROXY v2 header this listener requires. Private-network
    # hosts use runner-local HAProxy. Neither path traverses the Hetzner LB.
    - name: private-https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: preview-usehivy-tls
