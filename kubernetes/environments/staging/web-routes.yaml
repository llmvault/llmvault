apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-http-redirect
  labels:
    app.kubernetes.io/name: hivy-web
    hivy.io/apply-phase: workload
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: http
  hostnames:
    - staging.usehivy.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    app.kubernetes.io/name: hivy-web
    hivy.io/apply-phase: workload
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: https
  hostnames:
    - staging.usehivy.com
  rules:
    - backendRefs:
        - name: web
          port: 8080
