apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-redis-config
  labels:
    hivy.io/apply-phase: data
data:
  redis-additional.conf: |
    appendonly yes
    appendfsync everysec
    maxmemory-policy noeviction
    tcp-keepalive 300
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: backend-redis
  labels:
    hivy.io/apply-phase: data
spec:
  # Staging deliberately uses one persistent standalone Redis instance.
  redisConfig:
    additionalRedisConfig: backend-redis-config
    maxMemoryPercentOfLimit: 75
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  kubernetesConfig:
    # v8.6.2, pinned to the same image used by production Redis Cluster.
    image: quay.io/opstree/redis@sha256:5f79911253cb74636e8e97555b08095902d46a835c6423adb123295b00ba70d7
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: backend-redis-auth
      key: password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
