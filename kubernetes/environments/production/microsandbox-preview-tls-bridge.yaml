apiVersion: v1
kind: ConfigMap
metadata:
  name: microsandbox-preview-tls-bridge-config
  labels:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    app.kubernetes.io/component: private-ingress
    hivy.io/apply-phase: ingress
data:
  haproxy.cfg: |
    global
        log stdout format raw local0

    defaults
        mode tcp
        timeout connect 5s
        timeout client 1h
        timeout server 1h
        timeout tunnel 24h

    frontend health
        bind :8404
        mode http
        http-request return status 200 content-type text/plain string ok

    frontend private_preview_https
        bind :8443
        log global
        option tcplog
        option dontlognull
        default_backend cilium_gateway_https

    backend cilium_gateway_https
        option tcp-check
        server gateway cilium-gateway-public.ingress-public.svc.cluster.local:443 check inter 2s fall 3 rise 2 send-proxy-v2 check-send-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsandbox-preview-tls-bridge
  labels:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    app.kubernetes.io/component: private-ingress
    hivy.io/apply-phase: ingress
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-preview-tls-bridge
      app.kubernetes.io/component: private-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microsandbox-preview-tls-bridge
        app.kubernetes.io/component: private-ingress
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: microsandbox-preview-tls-bridge
                    app.kubernetes.io/component: private-ingress
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: haproxy:3.2.21-alpine@sha256:66e25cc9a8332635f4e897f7f4b1e5622c25f09f0ee23cddc6ce9bdb3a24772a
          args: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8404
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: microsandbox-preview-tls-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: microsandbox-preview-tls-bridge
  labels:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    app.kubernetes.io/component: private-ingress
    hivy.io/apply-phase: ingress
spec:
  selector:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    app.kubernetes.io/component: private-ingress
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: microsandbox-preview-tls-bridge
  labels:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    app.kubernetes.io/component: private-ingress
    hivy.io/apply-phase: ingress
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-preview-tls-bridge
      app.kubernetes.io/component: private-ingress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: microsandbox-preview-tls-bridge-ingress
  labels:
    app.kubernetes.io/name: microsandbox-preview-tls-bridge
    hivy.io/apply-phase: ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-preview-tls-bridge
      app.kubernetes.io/component: private-ingress
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hivy-backend
            k8s:io.kubernetes.pod.namespace: production
        - matchLabels:
            app.kubernetes.io/name: hivy-backend
            k8s:io.kubernetes.pod.namespace: staging
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8404"
              protocol: TCP
