apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nango-http-redirect
  labels:
    app.kubernetes.io/name: nango
    hivy.io/apply-phase: workload
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: http
  hostnames:
    - connections.usehivy.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nango-https
  labels:
    app.kubernetes.io/name: nango
    hivy.io/apply-phase: workload
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: https
  hostnames:
    - connections.usehivy.com
  rules:
    - backendRefs:
        - name: nango
          port: 3003
