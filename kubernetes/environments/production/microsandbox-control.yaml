apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsandbox-control
  labels:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: control-plane
    hivy.io/apply-phase: workload
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-control
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microsandbox-control
        app.kubernetes.io/component: control-plane
        hivy.io/environment: production
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/usehivy/msb@sha256:e19cf81de561489b11923c001cb2f95f75aadea64cd964078d2712b6b38d5116
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          envFrom:
            - configMapRef:
                name: microsandbox-control-config
            - secretRef:
                name: microsandbox-control-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
      containers:
        - name: control
          image: ghcr.io/usehivy/msb@sha256:e19cf81de561489b11923c001cb2f95f75aadea64cd964078d2712b6b38d5116
          imagePullPolicy: IfNotPresent
          args: ["control"]
          envFrom:
            - configMapRef:
                name: microsandbox-control-config
            - secretRef:
                name: microsandbox-control-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: microsandbox-control
                    app.kubernetes.io/component: control-plane
---
apiVersion: v1
kind: Service
metadata:
  name: microsandbox-control
  labels:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: control-plane
    hivy.io/apply-phase: workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: microsandbox-control-private-node
  labels:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: private-node-endpoint
    hivy.io/apply-phase: workload
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32080
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: microsandbox-control
  labels:
    app.kubernetes.io/name: microsandbox-control
    app.kubernetes.io/component: control-plane
    hivy.io/apply-phase: workload
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-control
      app.kubernetes.io/component: control-plane
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: microsandbox-control-ingress
  labels:
    app.kubernetes.io/name: microsandbox-control
    hivy.io/apply-phase: workload
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: microsandbox-control
      app.kubernetes.io/component: control-plane
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: production
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: staging
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromCIDR:
        - 10.80.1.2/32
        - 10.80.1.3/32
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microsandbox-postgres-ingress
  labels:
    app.kubernetes.io/name: microsandbox-postgres
    hivy.io/apply-phase: data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: microsandbox-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: microsandbox-control
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9187
          protocol: TCP
