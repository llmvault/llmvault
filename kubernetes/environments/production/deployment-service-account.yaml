apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-image-deployer
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - backend-api
      - backend-worker
      - web
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-image-deployer
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-image-deployer
