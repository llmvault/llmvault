apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  labels:
    hivy.io/apply-phase: data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: backend-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  labels:
    hivy.io/apply-phase: data
spec:
  podSelector:
    matchLabels:
      redis_setup_type: cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 6379
          protocol: TCP
        - port: 16379
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
      ports:
        - port: 6379
          protocol: TCP
        - port: 16379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-isolation
  labels:
    hivy.io/apply-phase: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/component: vector-database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
              app.kubernetes.io/component: vector-database
      ports:
        - port: 6333
          protocol: TCP
        - port: 6334
          protocol: TCP
        - port: 6335
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hivy-backend
      ports:
        - port: 6334
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant-backup
      ports:
        - port: 6333
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
              app.kubernetes.io/component: vector-database
      ports:
        - port: 6333
          protocol: TCP
        - port: 6334
          protocol: TCP
        - port: 6335
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP

