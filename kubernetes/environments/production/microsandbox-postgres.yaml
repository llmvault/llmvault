apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: microsandbox-postgres
  labels:
    app.kubernetes.io/name: microsandbox-postgres
    app.kubernetes.io/component: database
    hivy.io/apply-phase: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:06d950644d127249699c1468d0ffad7e44c34daa11688b0e966dec947eb043c4
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: microsandbox-postgres-backup
  bootstrap:
    initdb:
      database: microsandbox
      owner: microsandbox
      secret:
        name: microsandbox-postgres-app
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
  storage:
    storageClass: longhorn
    size: 3Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: microsandbox-postgres-backup
  labels:
    app.kubernetes.io/name: microsandbox-postgres
    app.kubernetes.io/component: backup
    hivy.io/apply-phase: data
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://usehivy-prod-pg-microsandbox/postgres
    endpointURL: https://hel1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: microsandbox-postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: microsandbox-postgres-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 1
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: microsandbox-postgres-daily
  labels:
    app.kubernetes.io/name: microsandbox-postgres
    app.kubernetes.io/component: backup
    hivy.io/apply-phase: data
spec:
  schedule: "0 0 2 * * *"
  immediate: false
  backupOwnerReference: self
  cluster:
    name: microsandbox-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
