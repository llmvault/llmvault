apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backend-postgres
  labels:
    hivy.io/apply-phase: data
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:06d950644d127249699c1468d0ffad7e44c34daa11688b0e966dec947eb043c4
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backend-postgres-backup
  bootstrap:
    initdb:
      database: hivy
      owner: hivy
      secret:
        name: backend-postgres-app
  postgresql:
    parameters:
      max_connections: "300"
      max_locks_per_transaction: "256"
      shared_buffers: 1GB
  storage:
    storageClass: longhorn
    size: 50Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  monitoring:
    enablePodMonitor: false
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backend-postgres-backup
  labels:
    hivy.io/apply-phase: data
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://usehivy-prod-pg-backend/postgres
    endpointURL: https://hel1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: backend-postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: backend-postgres-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backend-postgres-daily
  labels:
    hivy.io/apply-phase: data
spec:
  schedule: "0 0 1 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: backend-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

