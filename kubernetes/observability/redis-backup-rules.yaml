apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: hivy-redis-backups
spec:
  groups:
    - name: hivy-redis-backups
      rules:
        - alert: HivyRedisBackupFailed
          expr: |
            max by (namespace, job_name) (
              kube_job_status_start_time{
                namespace=~"production|staging",
                job_name=~"backend-redis-backup-.*"
              }
              and on (namespace, job_name)
              (
                kube_job_status_failed{
                  namespace=~"production|staging",
                  job_name=~"backend-redis-backup-.*"
                } > 0
              )
            )
            > on (namespace) group_left
            max by (namespace) (
              kube_cronjob_status_last_successful_time{
                namespace=~"production|staging",
                cronjob="backend-redis-backup"
              }
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Redis backup job failed in {{ $labels.namespace }}"
            description: "Job {{ $labels.job_name }} failed after the latest verified Redis recovery point."
        - alert: HivyRedisBackupStale
          expr: |
            (
              time() -
              kube_cronjob_status_last_successful_time{
                namespace=~"production|staging",
                cronjob="backend-redis-backup"
              }
              > 108000
            )
            or
            (
              time() -
              kube_cronjob_created{
                namespace=~"production|staging",
                cronjob="backend-redis-backup"
              }
              > 21600
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{
                namespace=~"production|staging",
                cronjob="backend-redis-backup"
              }
            )
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Redis backup is stale in {{ $labels.namespace }}"
            description: "The Redis backup CronJob has no verified success within the 30-hour recovery-point objective."
