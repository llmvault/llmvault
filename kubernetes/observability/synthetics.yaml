apiVersion: v1
kind: ConfigMap
metadata:
  name: hivy-blackbox-exporter
  labels:
    app.kubernetes.io/name: hivy-blackbox-exporter
    app.kubernetes.io/part-of: hivy-observability
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivy-blackbox-exporter
  labels:
    app.kubernetes.io/name: hivy-blackbox-exporter
    app.kubernetes.io/part-of: hivy-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivy-blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivy-blackbox-exporter
        app.kubernetes.io/part-of: hivy-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args:
            - --config.file=/etc/blackbox/blackbox.yaml
            - --log.level=warn
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hivy-blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: hivy-blackbox-exporter
  labels:
    app.kubernetes.io/name: hivy-blackbox-exporter
    app.kubernetes.io/part-of: hivy-observability
spec:
  selector:
    app.kubernetes.io/name: hivy-blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
      protocol: TCP
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: hivy-public-journeys
  labels:
    app.kubernetes.io/part-of: hivy-observability
spec:
  jobName: hivy-public-journeys
  interval: 30s
  scrapeTimeout: 15s
  module: http_2xx
  vmProberSpec:
    url: hivy-blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - https://api.usehivy.com/healthz
        - https://usehivy.com/api/health
        - https://staging.api.usehivy.com/healthz
        - https://staging.usehivy.com/api/health
