apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http
  namespace: gateway-smoke
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: http
  hostnames:
    - gateway-check.usehivy.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-echo
  namespace: gateway-smoke
spec:
  parentRefs:
    - name: public
      namespace: ingress-public
      sectionName: https
  hostnames:
    - gateway-check.usehivy.com
  rules:
    - backendRefs:
        - name: gateway-echo
          port: 8080
