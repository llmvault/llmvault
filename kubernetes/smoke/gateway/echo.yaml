apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-echo
  namespace: gateway-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-echo
  template:
    metadata:
      labels:
        app: gateway-echo
    spec:
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-echo
  namespace: gateway-smoke
spec:
  selector:
    app: gateway-echo
  ports:
    - name: http
      port: 8080
      targetPort: http
