# Cilium is rendered from the pinned OCI Helm chart into a local, git-ignored
# manifest and then installed with kubectl apply. Helm does not own the release.
kubeProxyReplacement: true
# K3s exposes its supervisor/API load balancer on every server and agent. Keep
# Cilium node-local so no individual control-plane address is a dependency.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6444

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16
    clusterPoolIPv4MaskSize: 24

routingMode: tunnel
tunnelProtocol: vxlan
MTU: 1350

bpf:
  masquerade: true

operator:
  replicas: 2

rollOutCiliumPods: true
policyEnforcementMode: default
l7Proxy: true

envoy:
  enabled: true
  terminationGracePeriodSeconds: 60
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

gatewayAPI:
  enabled: true
  enableProxyProtocol: true
  enableAppProtocol: true
  enableAlpn: true
  xffNumTrustedHops: 0
  gatewayClass:
    create: "true"
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        hivy.io/public-ingress: "true"

hubble:
  relay:
    enabled: true
  ui:
    enabled: false

prometheus:
  enabled: true
