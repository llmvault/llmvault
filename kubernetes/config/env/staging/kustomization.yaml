apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: backend-config
    envs:
      - backend.config.env
    options:
      labels:
        hivy.io/apply-phase: data
  - name: nango-config
    envs:
      - nango.config.env
    options:
      labels:
        app.kubernetes.io/name: nango
        hivy.io/apply-phase: workload
  - name: web-config
    envs:
      - web.config.env
    options:
      labels:
        app.kubernetes.io/name: hivy-web
        hivy.io/apply-phase: data
secretGenerator:
  - name: backend-secrets
    envs:
      - backend.env
      - qdrant.env
    type: Opaque
  - name: backend-postgres-app
    envs:
      - postgres.env
    type: kubernetes.io/basic-auth
  - name: backend-postgres-observability
    envs:
      - postgres-observability.env
    type: kubernetes.io/basic-auth
  - name: backend-redis-auth
    envs:
      - redis.env
    type: Opaque
  - name: qdrant-auth
    envs:
      - qdrant.env
    type: Opaque
  - name: backend-postgres-backup-s3
    envs:
      - postgres-backup.env
    type: Opaque
  - name: qdrant-backup-s3
    envs:
      - qdrant-backup.env
    type: Opaque
  - name: backend-redis-backup-s3
    envs:
      - redis-backup.env
    type: Opaque
  - name: nango-runtime-secrets
    envs:
      - nango-runtime.env
    type: Opaque
  - name: nango-backend-credentials
    envs:
      - nango-backend.env
    type: Opaque
  - name: nango-postgres-app
    envs:
      - nango-postgres.env
    type: kubernetes.io/basic-auth
  - name: nango-postgres-backup-s3
    envs:
      - nango-postgres-backup.env
    type: Opaque
  - name: web-secrets
    envs:
      - web.env
    type: Opaque
    options:
      labels:
        app.kubernetes.io/name: hivy-web
generatorOptions:
  disableNameSuffixHash: true
  labels:
    hivy.io/apply-phase: data
