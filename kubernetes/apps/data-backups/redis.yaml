apiVersion: batch/v1
kind: CronJob
metadata:
  name: backend-redis-backup
  labels:
    hivy.io/apply-phase: data
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 14400
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backend-redis-backup
            app.kubernetes.io/component: backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: backup-and-validate
              image: quay.io/opstree/redis@sha256:5f79911253cb74636e8e97555b08095902d46a835c6423adb123295b00ba70d7
              imagePullPolicy: IfNotPresent
              command:
                - /opt/hivy/redis-backup/backup.sh
              env:
                - name: REDIS_BACKUP_MODE
                  value: cluster
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-redis-auth
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /opt/hivy/redis-backup
                  readOnly: true
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.27.49@sha256:bad3346a39098ab077be6ed58c7e1fe68321a4a844c7c740318100013e6c3581
              imagePullPolicy: IfNotPresent
              command:
                - /opt/hivy/redis-backup/upload.sh
              envFrom:
                - secretRef:
                    name: backend-redis-backup-s3
              env:
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: REDIS_BACKUP_MODE
                  value: cluster
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /opt/hivy/redis-backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 10Gi
            - name: scripts
              configMap:
                name: redis-backup-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
