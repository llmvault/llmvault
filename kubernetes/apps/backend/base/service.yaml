apiVersion: v1
kind: Service
metadata:
  name: backend-api
  labels:
    hivy.io/apply-phase: workload
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hivy-backend
    app.kubernetes.io/component: api
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: mcp
      port: 8081
      targetPort: mcp
      protocol: TCP
