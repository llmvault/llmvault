apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  labels:
    hivy.io/apply-phase: workload
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hivy-backend
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivy-backend
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/usehivy/hivy:main
          imagePullPolicy: IfNotPresent
          command:
            - /hivy
          args:
            - migrate
            - up
          env:
            - name: HIVY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_LOG_LEVEL
            - name: HIVY_LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_LOG_FORMAT
            - name: HIVY_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_DB_HOST
            - name: HIVY_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_DB_PORT
            - name: HIVY_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_DB_USER
            - name: HIVY_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_DB_NAME
            - name: HIVY_DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: HIVY_DB_SSLMODE
            - name: HIVY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-postgres-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: ghcr.io/usehivy/hivy:main
          imagePullPolicy: IfNotPresent
          command:
            - /hivy
          args:
            - work
          ports:
            - name: health
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: HIVY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-postgres-app
                  key: password
            - name: HIVY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-redis-auth
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
