apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-redis-exporter
  labels:
    app.kubernetes.io/name: backend-redis-exporter
    app.kubernetes.io/component: metrics
    hivy.io/apply-phase: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-redis-exporter
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-redis-exporter
        app.kubernetes.io/component: metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/oliver006/redis_exporter@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: redis://backend-redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-redis-auth
                  key: password
            - name: REDIS_EXPORTER_PING_ON_CONNECT
              value: "true"
            - name: REDIS_EXPORTER_REDIS_ONLY_METRICS
              value: "true"
            - name: REDIS_EXPORTER_REDACT_CONFIG_METRICS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend-redis-exporter
  labels:
    app.kubernetes.io/name: backend-redis-exporter
    app.kubernetes.io/component: metrics
    hivy.io/apply-phase: data
spec:
  selector:
    app.kubernetes.io/name: backend-redis-exporter
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
