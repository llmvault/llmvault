host: api.example.com
info:
  contact: {}
  description: Proxy runtime for LLM API credentials.
  title: Hivy API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password. Revokes all sessions.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/confirm-email:
    post:
      consumes:
      - application/json
      description: Confirms a user's email address using a 6-digit code.
      parameters:
      - description: Email and 6-digit code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/confirmEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
      summary: Confirm email address
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the email address if an account
        exists.
      parameters:
      - description: Email address
        in: body
        name: body
