            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: List admin integration definitions
      tags:
      - admin
  /v1/admin/integrations/{id}:
    delete:
      description: Removes a supported global integration when it has no active connections.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      - description: Integration definition ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: Delete an admin integration
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Creates or updates the supported global integration in Nango and
        the Hivy database.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      - description: Integration definition ID
        in: path
        name: id
        required: true
        type: string
      - description: Integration credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/upsertAdminIntegrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/upsertAdminIntegrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: Sync an admin integration
      tags:
      - admin
  /v1/admin/llm-providers:
    get:
      description: Returns available LLM provider definitions for system credential
        setup.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/adminLLMProviderResponse'
