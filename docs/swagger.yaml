      consumes:
      - application/json
      description: Patches mutable fields (name, status pause/resume, refresh / prune
        frequencies, indexing_start floor). Only ACTIVE ↔ PAUSED transitions are client-settable;
        DELETING is server-managed.
      parameters:
      - description: Source ID
        in: path
        name: id
        required: true
        type: string
      - description: Patch payload
        in: body
        name: body
        required: true
