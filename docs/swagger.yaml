      - BearerAuth: []
      summary: List LLM providers
      tags:
      - admin
  /v1/admin/system-credentials:
    get:
      description: Returns globally scoped system credentials with cursor-based pagination.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      - description: Filter by provider ID
        in: query
        name: provider_id
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginatedResponse-credentialResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: List system credentials
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Stores an encrypted globally scoped credential.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      - description: Credential details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createCredentialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credentialResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: Create system credential
      tags:
      - admin
  /v1/admin/system-credentials/{id}:
    delete:
      description: Revokes a globally scoped system credential.
      parameters:
      - description: Admin secret
        in: header
        name: X-Hivy-Admin-Secret
        required: true
        type: string
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: Revoke system credential
      tags:
      - admin
  /v1/agents:
    get:
      description: |-
        Returns the agents visible to the caller with skills (metadata only — no bundle content),
        and triggers. Org managers and API-key callers see every agent in the org; a regular
        member sees only agents assigned to channels they can use.
      parameters:
      - description: Filter by status (draft, active, archived)
        in: query
        name: status
        type: string
      - description: Page size (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginatedResponse-agentListItem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errorResponse'
      security:
      - BearerAuth: []
      summary: List AI agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Creates a user-managed agent definition. Sandbox creation stays
        lazy until the first session.
      parameters:
      - description: Agent create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agentMutationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agentMutationResponse'
        "400":
          description: Bad Request
