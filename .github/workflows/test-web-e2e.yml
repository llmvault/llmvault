name: web e2e

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/e2e/**"
      - "apps/web/lib/**"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - ".github/workflows/test-web-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/e2e/**"
      - "apps/web/lib/**"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - ".github/workflows/test-web-e2e.yml"

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PLAYWRIGHT_BASE_URL: "https://usehivy.com"

jobs:
  web-e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web
        timeout-minutes: 5

      - name: install playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web
        timeout-minutes: 3

      - name: run e2e tests
        run: pnpm run test:e2e
        working-directory: apps/web
        timeout-minutes: 5
        env:
          QA_EMAIL_LOGIN_PROD: ${{ secrets.QA_EMAIL_LOGIN_PROD }}
          QA_PASSWORD_LOGIN_PROD: ${{ secrets.QA_PASSWORD_LOGIN_PROD }}

      - name: run mocked MCP settings e2e
        run: pnpm run test:e2e:mcp
        working-directory: apps/web
        timeout-minutes: 3

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
