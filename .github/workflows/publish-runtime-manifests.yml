name: publish runtime manifests

# Publishes multi-arch tags from already-built architecture images.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
  repository_dispatch:
    types: [publish-runtime-manifests]
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish runtime manifests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || contains(github.event.head_commit.message, '[publish-runtime-manifests]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
      version: ${{ steps.version.outputs.RELEASE_VERSION }}
      commit: ${{ steps.version.outputs.RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: resolve release
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "${tag}" ]]; then
            tag="${{ github.event.client_payload.tag }}"
          fi
          if [[ -z "${tag}" ]]; then
            tag="v1.0.0"
          fi
          git fetch --tags --force
          commit="$(git rev-list -n 1 "${tag}")"
          ./scripts/release/derive-version.sh "${tag}" "${commit}" >> "$GITHUB_OUTPUT"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish manifests
        shell: bash
        run: |
          runtime="ghcr.io/usehivy/hivy-sandboxes-runtime"
          developers="ghcr.io/usehivy/hivy-sandboxes-runtime-developers"
          for image in "$runtime" "$developers"; do
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_TAG }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_VERSION }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            if [[ "${{ steps.version.outputs.RELEASE_IS_PRERELEASE }}" != "true" ]]; then
              docker buildx imagetools create \
                -t "${image}:latest" \
                "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
                "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            fi
          done

      - name: write manifest
        run: ./scripts/release/write-manifest.sh "${{ steps.version.outputs.RELEASE_TAG }}" release-manifest.json "${{ steps.version.outputs.RELEASE_COMMIT }}"

      - name: archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

      - name: upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.RELEASE_TAG }}" release-manifest.json --clobber

  microsandbox-snapshots:
    name: microsandbox snapshots (${{ matrix.size }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        size:
          - small
          - medium
          - large
          - xlarge
    env:
      HIVY_MICROSANDBOX_API_TOKEN: ${{ secrets.HIVY_MICROSANDBOX_API_TOKEN }}
      HIVY_MICROSANDBOX_CONTROL_URL: ${{ secrets.HIVY_MICROSANDBOX_CONTROL_URL || vars.HIVY_MICROSANDBOX_CONTROL_URL }}
      HIVY_MICROSANDBOX_SNAPSHOT_ORG_ID: ${{ vars.HIVY_MICROSANDBOX_SNAPSHOT_ORG_ID || 'org_system' }}
      HIVY_MICROSANDBOX_IMAGE_ARCH_SUFFIX: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: publish snapshots
        run: |
          control_url="${HIVY_MICROSANDBOX_CONTROL_URL:-https://msb.usehivy.com}"
          scripts/microsandbox/publish-latest-snapshots.py \
            --control-url "${control_url}" \
            --tag "${{ needs.publish.outputs.tag }}" \
            --size "${{ matrix.size }}" \
            --concurrency 2 \
            --output "dist/microsandbox-snapshots-${{ needs.publish.outputs.tag }}-${{ matrix.size }}.json"

      - name: archive snapshot manifest
        uses: actions/upload-artifact@v4
        with:
          name: microsandbox-snapshots-${{ matrix.size }}
          path: dist/microsandbox-snapshots-${{ needs.publish.outputs.tag }}-${{ matrix.size }}.json

  update-railway-runtime-config:
    name: update Railway runtime config
    runs-on: ubuntu-latest
    needs:
      - publish
      - microsandbox-snapshots
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: install Railway CLI
        run: npm install -g @railway/cli

      - name: update Railway runtime config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICES: "api.usehivy.com asynq.usehivy.com"
          HIVY_SANDBOXES_RUNTIME_IMAGE_ARCH_SUFFIX: amd64
        run: ./scripts/release/update-railway-runtime-config.sh release-manifest.json
