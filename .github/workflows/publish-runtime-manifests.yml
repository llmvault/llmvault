name: publish runtime manifests

# Publishes multi-arch tags from already-built architecture images.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
  repository_dispatch:
    types: [publish-runtime-manifests]
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish runtime manifests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || contains(github.event.head_commit.message, '[publish-runtime-manifests]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
      version: ${{ steps.version.outputs.RELEASE_VERSION }}
      prerelease: ${{ steps.version.outputs.RELEASE_IS_PRERELEASE }}
      commit: ${{ steps.version.outputs.RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: resolve release
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "${tag}" ]]; then
            tag="${{ github.event.client_payload.tag }}"
          fi
          if [[ -z "${tag}" ]]; then
            tag="v1.0.0"
          fi
          git fetch --tags --force
          commit="$(git rev-list -n 1 "${tag}")"
          bash ./scripts/release/derive-version.sh "${tag}" "${commit}" >> "$GITHUB_OUTPUT"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish manifests
        shell: bash
        run: |
          runtime="ghcr.io/usehivy/hivy-sandboxes-runtime"
          developers="ghcr.io/usehivy/hivy-sandboxes-runtime-developers"
          runtime_daytona="ghcr.io/usehivy/hivy-sandboxes-runtime-daytona"
          developers_daytona="ghcr.io/usehivy/hivy-sandboxes-runtime-developers-daytona"
          for image in "$runtime" "$developers"; do
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_TAG }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_VERSION }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            if [[ "${{ steps.version.outputs.RELEASE_IS_PRERELEASE }}" != "true" ]]; then
              docker buildx imagetools create \
                -t "${image}:latest" \
                "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64" \
                "${image}:${{ steps.version.outputs.RELEASE_TAG }}-arm64"
            fi
          done
          for image in "$runtime_daytona" "$developers_daytona"; do
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_TAG }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64"
            docker buildx imagetools create \
              -t "${image}:${{ steps.version.outputs.RELEASE_VERSION }}" \
              "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64"
            if [[ "${{ steps.version.outputs.RELEASE_IS_PRERELEASE }}" != "true" ]]; then
              docker buildx imagetools create \
                -t "${image}:latest" \
                "${image}:${{ steps.version.outputs.RELEASE_TAG }}-amd64"
            fi
          done

      - name: write manifest
        run: ./scripts/release/write-manifest.sh "${{ steps.version.outputs.RELEASE_TAG }}" release-manifest.json "${{ steps.version.outputs.RELEASE_COMMIT }}"

      - name: archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

      - name: upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.RELEASE_TAG }}" release-manifest.json --clobber

  publish-daytona-snapshots:
    name: publish Daytona snapshots
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs:
      - publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install Daytona CLI
        run: |
          sudo curl -fL https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64 -o /usr/local/bin/daytona
          sudo chmod +x /usr/local/bin/daytona

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish versioned snapshots
        env:
          HIVY_DAYTONA_API_KEY: ${{ secrets.HIVY_DAYTONA_API_KEY }}
          HIVY_DAYTONA_API_URL: ${{ vars.HIVY_DAYTONA_API_URL }}
          HIVY_DAYTONA_TARGET: ${{ vars.HIVY_DAYTONA_TARGET }}
        run: bash ./scripts/release/publish-daytona-snapshots.sh release-manifest.json

      - name: verify default and developer snapshots
        env:
          HIVY_DAYTONA_API_KEY: ${{ secrets.HIVY_DAYTONA_API_KEY }}
          HIVY_DAYTONA_API_URL: ${{ vars.HIVY_DAYTONA_API_URL }}
          HIVY_DAYTONA_TARGET: ${{ vars.HIVY_DAYTONA_TARGET }}
        run: |
          version="${{ needs.publish.outputs.version }}"
          dashed_version="${version//./-}"
          go run ./cmd/verify-devbox -snapshot "hivy-sandboxes-runtime-daytona-${dashed_version}-small-v1"
          go run ./cmd/verify-devbox -snapshot "hivy-sandboxes-runtime-developers-daytona-${dashed_version}-small-v1"

  update-railway-runtime-config:
    name: update Railway runtime config
    runs-on: ubuntu-latest
    if: needs.publish.outputs.prerelease != 'true'
    needs:
      - publish
      - publish-daytona-snapshots
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: install Railway CLI
        run: npm install -g @railway/cli

      - name: update Railway runtime config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICES: "api.usehivy.com asynq.usehivy.com"
          HIVY_SANDBOXES_RUNTIME_IMAGE_ARCH_SUFFIX: amd64
          HIVY_SANDBOX_PROVIDER_ID: daytona
          HIVY_DAYTONA_API_KEY: ${{ secrets.HIVY_DAYTONA_API_KEY }}
          HIVY_DAYTONA_API_URL: ${{ vars.HIVY_DAYTONA_API_URL }}
          HIVY_DAYTONA_TARGET: ${{ vars.HIVY_DAYTONA_TARGET }}
        run: ./scripts/release/update-railway-runtime-config.sh release-manifest.json
