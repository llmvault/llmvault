name: flagship runtime e2e

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model to use for the live runtime E2E
        required: true
        default: deepseek/deepseek-v4-flash
        type: string
      trace_full:
        description: Emit full SSE/proxy trace bodies instead of compact logs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flagship-runtime-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.10"
  CI: "true"
  GOTOOLCHAIN: local
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  flagship-runtime-e2e:
    name: flagship runtime e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIVY_AGENT_RUNTIME_E2E: "1"
      HIVY_AGENT_RUNTIME_E2E_MODEL: ${{ inputs.model }}
      HIVY_SYSTEM_OPENROUTER_API_KEY: ${{ secrets.HIVY_SYSTEM_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sandboxes/runtime -> target

      - name: verify live model secret
        shell: bash
        run: |
          if [[ -z "${HIVY_SYSTEM_OPENROUTER_API_KEY:-}" ]]; then
            echo "HIVY_SYSTEM_OPENROUTER_API_KEY repository secret is required for the flagship runtime E2E." >&2
            exit 1
          fi

      - name: verify docker
        run: docker version

      - name: run flagship runtime e2e
        shell: bash
        timeout-minutes: 45
        run: |
          if [[ "${{ inputs.trace_full }}" == "true" ]]; then
            export HIVY_AGENT_RUNTIME_E2E_TRACE_FULL=1
          else
            export HIVY_AGENT_RUNTIME_E2E_TRACE_COMPACT=1
          fi

          go test -count=1 -v ./e2e -run '^TestAgentRuntimeCodingTaskE2E$' -timeout 45m

      - name: cleanup docker
        if: always()
        run: docker system prune -af --volumes
