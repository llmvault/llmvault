name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: prepare release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
      version: ${{ steps.version.outputs.RELEASE_VERSION }}
      dashed: ${{ steps.version.outputs.RELEASE_DASHED }}
      prerelease: ${{ steps.version.outputs.RELEASE_IS_PRERELEASE }}
      commit: ${{ steps.version.outputs.RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: derive version
        id: version
        run: ./scripts/release/derive-version.sh "${{ github.event.release.tag_name || inputs.tag }}" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  api-image:
    name: api image
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        shell: bash
        run: |
          tags="ghcr.io/usehivy/hivy:${{ needs.prepare.outputs.tag }}"
          tags="${tags},ghcr.io/usehivy/hivy:${{ needs.prepare.outputs.version }}"
          if [[ "${{ needs.prepare.outputs.prerelease }}" != "true" ]]; then
            tags="${tags},ghcr.io/usehivy/hivy:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/usehivy/hivy
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

  sandbox-runtime-images:
    name: sandbox runtime images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            make_target: sandbox-runtime-linux-build-amd64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: sandbox-runtime-release-${{ matrix.target }}
          workspaces: sandboxes/runtime -> target

      - name: build runtime binary
        run: make ${{ matrix.make_target }}

      - name: prepare runtime Docker build context
        run: cp "sandboxes/runtime/dist/hivy-sandboxes-runtime-${{ matrix.target }}" sandboxes/runtime/hivy-sandboxes-runtime

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push default runtime image
        uses: useblacksmith/build-push-action@v2
        with:
          context: sandboxes/runtime
          file: sandboxes/runtime/Dockerfile.runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/usehivy/hivy-sandboxes-runtime:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/usehivy/hivy-sandboxes-runtime:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/usehivy/hivy
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

      - name: build and push developers runtime image
        uses: useblacksmith/build-push-action@v2
        with:
          context: sandboxes/runtime
          file: sandboxes/runtime/Dockerfile.developers
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/usehivy/hivy-sandboxes-runtime-developers:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/usehivy/hivy-sandboxes-runtime-developers:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/usehivy/hivy
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

  release-manifest:
    name: release manifest
    runs-on: ubuntu-latest
    needs:
      - prepare
      - api-image
      - sandbox-runtime-images
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create sandbox runtime multi-arch manifests
        shell: bash
        run: |
          runtime="ghcr.io/usehivy/hivy-sandboxes-runtime"
          developers="ghcr.io/usehivy/hivy-sandboxes-runtime-developers"
          for image in "$runtime" "$developers"; do
            docker buildx imagetools create \
              -t "${image}:${{ needs.prepare.outputs.tag }}" \
              "${image}:${{ needs.prepare.outputs.tag }}-amd64"
            docker buildx imagetools create \
              -t "${image}:${{ needs.prepare.outputs.version }}" \
              "${image}:${{ needs.prepare.outputs.version }}-amd64"
            if [[ "${{ needs.prepare.outputs.prerelease }}" != "true" ]]; then
              docker buildx imagetools create \
                -t "${image}:latest" \
                "${image}:${{ needs.prepare.outputs.tag }}-amd64"
            fi
          done

      - name: write manifest
        run: ./scripts/release/write-manifest.sh "${{ needs.prepare.outputs.tag }}" release-manifest.json "${{ needs.prepare.outputs.commit }}"

      - name: archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

      - name: upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release-manifest.json --clobber

  microsandbox-snapshots:
    name: microsandbox snapshots (${{ matrix.size }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - prepare
      - release-manifest
    strategy:
      fail-fast: false
      matrix:
        size:
          - small
          - medium
          - large
          - xlarge
    env:
      HIVY_MICROSANDBOX_API_TOKEN: ${{ secrets.HIVY_MICROSANDBOX_API_TOKEN }}
      HIVY_MICROSANDBOX_CONTROL_URL: ${{ secrets.HIVY_MICROSANDBOX_CONTROL_URL || vars.HIVY_MICROSANDBOX_CONTROL_URL }}
      HIVY_MICROSANDBOX_SNAPSHOT_ORG_ID: ${{ vars.HIVY_MICROSANDBOX_SNAPSHOT_ORG_ID || 'org_system' }}
      HIVY_MICROSANDBOX_IMAGE_ARCH_SUFFIX: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: publish snapshots
        run: |
          control_url="${HIVY_MICROSANDBOX_CONTROL_URL:-https://msb.usehivy.com}"
          scripts/microsandbox/publish-latest-snapshots.py \
            --control-url "${control_url}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --size "${{ matrix.size }}" \
            --concurrency 2 \
            --output "dist/microsandbox-snapshots-${{ needs.prepare.outputs.tag }}-${{ matrix.size }}.json"

      - name: archive snapshot manifest
        uses: actions/upload-artifact@v4
        with:
          name: microsandbox-snapshots-${{ matrix.size }}
          path: dist/microsandbox-snapshots-${{ needs.prepare.outputs.tag }}-${{ matrix.size }}.json

  update-railway-runtime-config:
    name: update Railway runtime config
    runs-on: ubuntu-latest
    needs:
      - prepare
      - release-manifest
      - microsandbox-snapshots
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: install Railway CLI
        run: npm install -g @railway/cli

      - name: update Railway runtime config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICES: "api.usehivy.com asynq.usehivy.com"
          HIVY_SANDBOXES_RUNTIME_IMAGE_ARCH_SUFFIX: amd64
        run: ./scripts/release/update-railway-runtime-config.sh release-manifest.json
