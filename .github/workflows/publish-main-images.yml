name: publish-main-images

on:
  push:
    branches: [main]

concurrency:
  group: publish-main-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Go API image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/usehivy/hivy
    steps:
      - uses: actions/checkout@v6

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  web:
    name: Next.js web image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/usehivy/web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  sandbox-runtime:
    name: Sandbox runtime images
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: sandbox-runtime-main-x86_64-unknown-linux-gnu
          workspaces: sandboxes/runtime -> target

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runtime binary
        run: make sandbox-runtime-linux-build-amd64

      - name: Build canvas CLI
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=main -X main.commit=${{ github.sha }}" -o sandboxes/runtime/canvas ./cmd/canvas

      - name: Prepare runtime Docker build context
        run: cp sandboxes/runtime/dist/hivy-sandboxes-runtime-x86_64-unknown-linux-gnu sandboxes/runtime/hivy-sandboxes-runtime

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push default runtime image
        uses: useblacksmith/build-push-action@v2
        with:
          context: sandboxes/runtime
          file: sandboxes/runtime/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/usehivy/hivy-sandboxes-runtime:main-amd64
            ghcr.io/usehivy/hivy-sandboxes-runtime:sha-${{ github.sha }}-amd64
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

      - name: Build and push developers runtime image
        uses: useblacksmith/build-push-action@v2
        with:
          context: sandboxes/runtime
          file: sandboxes/runtime/Dockerfile.developers
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/usehivy/hivy-sandboxes-runtime-developers:main-amd64
            ghcr.io/usehivy/hivy-sandboxes-runtime-developers:sha-${{ github.sha }}-amd64
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  sandbox-app:
    name: Sandbox app image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare app Docker build context
        run: HIVY_APP_CONTEXT_OUT="${RUNNER_TEMP}/app-context" bash sandboxes/app/build_image.sh

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app sandbox image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ runner.temp }}/app-context
          file: ${{ runner.temp }}/app-context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/usehivy/hivy-app:main-amd64
            ghcr.io/usehivy/hivy-app:sha-${{ github.sha }}-amd64
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  microsandbox-control:
    name: Microsandbox control-plane image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/usehivy/msb
    steps:
      - uses: actions/checkout@v6

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.msb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  microsandbox-gateway:
    name: Microsandbox preview-gateway image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/usehivy/microsandbox-gateway
    steps:
      - uses: actions/checkout@v6

      - name: Set up Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: services/microsandbox-gateway
          file: services/microsandbox-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main

  deploy-production:
    name: Deploy production application images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - api
      - web
      - sandbox-runtime
      - sandbox-app
    environment: production
    env:
      K8S_NAMESPACE: production
      BACKEND_IMAGE: ghcr.io/usehivy/hivy@${{ needs.api.outputs.digest }}
      WEB_IMAGE: ghcr.io/usehivy/web@${{ needs.web.outputs.digest }}
      SANDBOX_RUNTIME_IMAGE_TAG: sha-${{ github.sha }}-amd64
      SANDBOX_APP_IMAGE_TAG: sha-${{ github.sha }}-amd64
      DEPLOYMENT_REVISION: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Connect to the private Kubernetes API
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          K8S_TUNNEL_SSH_KEY_B64: ${{ secrets.K8S_TUNNEL_SSH_KEY_B64 }}
          K8S_TUNNEL_KNOWN_HOSTS_B64: ${{ secrets.K8S_TUNNEL_KNOWN_HOSTS_B64 }}
          K8S_TUNNEL_HOSTS: ${{ vars.K8S_TUNNEL_HOSTS }}
          K8S_TUNNEL_USER: ${{ vars.K8S_TUNNEL_USER }}
          HIVY_MICROSANDBOX_RUNNER_FORWARD_TARGETS: ${{ vars.HIVY_MICROSANDBOX_RUNNER_FORWARD_TARGETS }}
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/hivy-kubeconfig"
          bash ./scripts/deploy/setup-kubernetes-tunnel.sh
          echo "KUBECONFIG=${KUBECONFIG}" >> "${GITHUB_ENV}"

      - name: Warm sandbox images on every production runner
        env:
          HIVY_MICROSANDBOX_RUNNER_API_TOKEN: ${{ secrets.HIVY_MICROSANDBOX_RUNNER_API_TOKEN }}
          HIVY_SANDBOXES_RUNTIME_IMAGE_ARCH_SUFFIX: amd64
          HIVY_SANDBOXES_APP_IMAGE_ARCH_SUFFIX: amd64
        run: |
          : "${HIVY_MICROSANDBOX_RUNNER_URLS:?production runner forwards are required}"
          bash ./scripts/release/write-main-manifest.sh \
            "${{ github.sha }}" \
            "${RUNNER_TEMP}/release-manifest.json"
          read -r -a runner_urls <<<"${HIVY_MICROSANDBOX_RUNNER_URLS}"
          bash ./scripts/release/warm-microsandbox-runner-images.sh \
            "${RUNNER_TEMP}/release-manifest.json" \
            "${runner_urls[@]}"

      - name: Deploy the commit tuple and wait for rollout
        run: bash ./scripts/deploy/kubernetes-images.sh
