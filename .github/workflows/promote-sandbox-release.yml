name: promote-sandbox-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, for example v1.2.3
        required: true
        type: string
      size:
        description: Snapshot sizes to register
        required: true
        default: all
        type: choice
        options:
          - all
          - micro
          - nano
          - small
          - medium
          - large
          - xlarge
      runtime:
        description: Register default runtime snapshots
        required: true
        default: true
        type: boolean
      developers:
        description: Register developers runtime snapshots
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Release tag to promote, for example v1.2.3
        required: true
        type: string
      size:
        description: Snapshot sizes to register
        required: true
        type: string
      runtime:
        description: Register default runtime snapshots
        required: true
        type: boolean
      developers:
        description: Register developers runtime snapshots
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  promote:
    name: promote sandbox release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      HIVY_DAYTONA_API_KEY: ${{ secrets.HIVY_DAYTONA_API_KEY }}
      HIVY_DAYTONA_API_URL: ${{ vars.HIVY_DAYTONA_API_URL }}
      HIVY_DAYTONA_TARGET: ${{ vars.HIVY_DAYTONA_TARGET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: download release manifest
        run: |
          gh release download "${{ inputs.tag }}" \
            --pattern release-manifest.json \
            --dir .

      - name: install Daytona CLI
        run: |
          sudo curl -fL https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64 -o /usr/local/bin/daytona
          sudo chmod +x /usr/local/bin/daytona
          daytona version

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish selected snapshots
        env:
          DAYTONA_SNAPSHOT_SIZES: ${{ inputs.size }}
          DAYTONA_PUBLISH_RUNTIME: ${{ inputs.runtime }}
          DAYTONA_PUBLISH_DEVELOPERS: ${{ inputs.developers }}
        run: bash ./scripts/release/publish-daytona-snapshots.sh release-manifest.json
