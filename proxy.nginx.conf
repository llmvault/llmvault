# Trusted-proxy real-client-IP resolution.
#
# Cloudflare fronts this nginx; it sets CF-Connecting-IP to the true client IP.
# ngx_http_realip_module rewrites $remote_addr to that value only for requests
# originating from Cloudflare's published ranges, so a direct (non-CF) client
# cannot spoof it. Any client-supplied True-Client-IP / X-Real-IP headers are
# stripped below before proxying upstream, so the Go trusted-proxy extractor
# only ever sees values nginx itself set.
#
# Keep this list in sync with https://www.cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# MCP server — mcp.usehivy.com / mcp.dev.usehivy.com
# Point these domains to the same Railway service as a custom domain.
# Nginx routes by Host header to the internal MCP server on :8081.
server {
    listen 80;
    server_name ~^mcp\.;
    server_tokens off;

    # MCP tool calls can carry large JSON payloads (file contents, context
    # blobs).  Without an explicit limit the default 1 MB from the global
    # nginx.conf would cause 413 errors for routine agent turns.
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip client-spoofable real-IP headers; nginx sets the authoritative
        # X-Real-IP above and the trusted-proxy extractor must not see forged values.
        proxy_set_header True-Client-IP "";

        # SSE / streaming — disable all buffering
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # MCP sessions can be long-lived
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy /health to the API's /readyz so the platform load balancer (and
    # Railway health checks) observe a 503 when the API itself is unhealthy,
    # rather than a static 200 that masks API or DB/Redis failures.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }
}

# LLM proxy — proxy.usehivy.com / proxy.dev.usehivy.com
# Rewrites all requests with /v1/proxy/ prefix so customers can call
# POST /v1/chat/completions and it routes to the Go proxy handler.
server {
    listen 80;
    server_name ~^proxy\.;
    server_tokens off;

    client_max_body_size 100m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080/v1/proxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip client-spoofable real-IP headers; nginx sets the authoritative
        # X-Real-IP above and the trusted-proxy extractor must not see forged values.
        proxy_set_header True-Client-IP "";

        # SSE / streaming — disable all buffering
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Long timeouts for slow models / large generations
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Large response headers (some providers return verbose headers)
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 64k;
    }

    # Proxy /health to the API's /readyz (see the MCP block above for rationale).
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }
}

# API — api.usehivy.com / *.railway.internal / everything else
# Straight pass-through to Go API on :8080, no path rewriting.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip client-spoofable real-IP headers; nginx sets the authoritative
        # X-Real-IP above and the trusted-proxy extractor must not see forged values.
        proxy_set_header True-Client-IP "";

        # SSE / streaming — disable all buffering
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 64k;
    }

    # Proxy /health to the API's /readyz (see the MCP block above for rationale).
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }
}
