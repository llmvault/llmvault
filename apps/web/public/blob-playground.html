<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blob Playground</title>
    <style>
      :root {
        color-scheme: light;
        --page: oklch(96.5% 0.018 78);
        --panel: oklch(98.7% 0.009 78);
        --panel-strong: oklch(92.7% 0.02 78);
        --line: oklch(84.5% 0.022 76);
        --ink: oklch(24% 0.032 252);
        --muted: oklch(49% 0.035 250);
        --accent: oklch(57% 0.17 27);
        --accent-soft: oklch(91% 0.058 33);
        --blob-fill: #1f2937;
        --eye-fill: #fbf6ec;
        --stage-fill: #efe5d7;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        width: min(1540px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: 1.85rem;
        line-height: 1.12;
        font-weight: 760;
      }

      .summary {
        width: min(360px, 100%);
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .toolbar {
        display: grid;
        grid-template-columns:
          minmax(280px, 1.05fr) minmax(280px, 1fr)
          minmax(280px, 0.95fr);
        gap: 16px;
        align-items: stretch;
        margin-bottom: 24px;
      }

      .control-band {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .control-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .control-title h2 {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.2;
      }

      .count {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 650;
      }

      input[type="color"] {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-strong);
        padding: 3px;
      }

      .button-row,
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button-row {
        margin-top: 12px;
      }

      .button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: oklch(98% 0.01 78);
        color: var(--ink);
        padding: 0 12px;
        font-size: 0.84rem;
        font-weight: 720;
        transition:
          background 170ms ease,
          border-color 170ms ease,
          transform 170ms ease;
      }

      .button:hover {
        border-color: oklch(73% 0.052 66);
        background: oklch(95.5% 0.024 72);
        transform: translateY(-1px);
      }

      .button:focus-visible,
      input:focus-visible {
        outline: 3px solid oklch(72% 0.12 40 / 0.35);
        outline-offset: 2px;
      }

      .button[aria-pressed="true"],
      .toggle input:checked + span {
        border-color: oklch(57% 0.17 27);
        background: var(--accent-soft);
        color: oklch(31% 0.088 30);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.46;
        transform: none;
      }

      .button.primary {
        border-color: oklch(49% 0.15 27);
        background: var(--accent);
        color: oklch(97% 0.012 72);
      }

      .button.primary:hover {
        border-color: oklch(42% 0.15 27);
        background: oklch(52% 0.17 27);
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
      }

      .toggle input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle span {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: oklch(98% 0.01 78);
        padding: 0 12px;
        color: var(--ink);
        font-size: 0.84rem;
        font-weight: 720;
      }

      .swatch {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 4px;
      }

      .swatch span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 5px;
        background:
          linear-gradient(
            135deg,
            var(--swatch-body) 0 49%,
            var(--swatch-eye) 50% 64%,
            var(--swatch-stage) 65% 100%
          );
      }

      .variants {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .variant {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: oklch(98% 0.01 78);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 720;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }

      .tile {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .tile:hover {
        border-color: oklch(75% 0.055 68);
        box-shadow: 0 18px 38px oklch(45% 0.04 65 / 0.1);
        transform: translateY(-2px);
      }

      .tile.is-selected {
        border-color: oklch(57% 0.17 27);
        background: oklch(97.2% 0.024 64);
      }

      .tile.is-selected .stage {
        box-shadow: inset 0 0 0 2px oklch(57% 0.17 27);
      }

      .stage {
        display: grid;
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border-radius: 7px;
        background:
          radial-gradient(
            circle at 30% 22%,
            oklch(99% 0.012 78 / 0.78),
            transparent 36%
          ),
          var(--stage-fill);
      }

      .blob {
        width: 78%;
        height: 78%;
        overflow: visible;
        transition:
          transform 180ms ease,
          filter 180ms ease;
        filter: drop-shadow(0 14px 18px oklch(42% 0.035 260 / 0.16));
      }

      .tile:hover .blob {
        transform: rotate(-2deg) scale(1.02);
      }

      .tile-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
      }

      .blob-name {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 760;
      }

      .tile-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .selector {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 760;
      }

      .selector input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--accent);
      }

      .copy {
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: oklch(98.2% 0.01 78);
        color: var(--ink);
        padding: 0 9px;
        font-size: 0.74rem;
        font-weight: 760;
      }

      .copy:hover {
        border-color: oklch(68% 0.09 38);
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        transform: translateY(18px);
        border: 1px solid oklch(70% 0.06 58);
        border-radius: 8px;
        background: oklch(24% 0.026 250);
        color: oklch(97% 0.01 78);
        padding: 11px 13px;
        font-size: 0.84rem;
        font-weight: 700;
        opacity: 0;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }

      .toast.is-visible {
        transform: translateY(0);
        opacity: 1;
      }

      @media (max-width: 900px) {
        .topbar,
        .toolbar {
          grid-template-columns: 1fr;
        }

        .topbar {
          display: grid;
          align-items: start;
        }
      }

      @media (max-width: 620px) {
        .shell {
          width: min(100% - 20px, 1540px);
          padding-top: 22px;
        }

        h1 {
          font-size: 1.45rem;
        }

        .controls,
        .variants {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
          gap: 10px;
        }

        .control-band,
        .tile {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Extracted SVG set</p>
          <h1>Blob playground with generated shapes and selectable exports</h1>
        </div>
        <p class="summary">
          Nine inline SVG blobs from the pasted HTML, with generated body
          variants that keep the extracted eye shapes intact.
        </p>
      </header>

      <section class="toolbar" aria-label="Blob controls">
        <div class="control-band">
          <div class="control-title">
            <h2>Colors</h2>
            <span class="count" id="totalCount">9 symbols</span>
          </div>
          <div class="controls">
            <label class="field">
              Blob
              <input id="blobColor" type="color" value="#1f2937" />
            </label>
            <label class="field">
              Eyes
              <input id="eyeColor" type="color" value="#fbf6ec" />
            </label>
            <label class="field">
              Stage
              <input id="stageColor" type="color" value="#efe5d7" />
            </label>
          </div>
          <div class="button-row">
            <button class="button" id="randomize" type="button">
              Random palette
            </button>
            <button class="button" id="reset" type="button">Reset</button>
            <label class="toggle">
              <input id="spectrum" type="checkbox" />
              <span>Per blob colors</span>
            </label>
          </div>
        </div>

        <div class="control-band">
          <div class="control-title">
            <h2>Eye shape</h2>
            <div class="swatches" aria-label="Palette presets"></div>
          </div>
          <div class="variants" role="group" aria-label="Eye variant">
            <button class="variant" type="button" data-variant="cutout">
              Original
            </button>
            <button class="variant" type="button" data-variant="soft">
              Softer
            </button>
            <button class="variant" type="button" data-variant="thin">
              Thinner
            </button>
            <button class="variant" type="button" data-variant="upward">
              Upward
            </button>
            <button class="variant" type="button" data-variant="tilted">
              Tilted
            </button>
          </div>
        </div>

        <div class="control-band">
          <div class="control-title">
            <h2>Generate</h2>
            <span class="count" id="selectionCount">0 selected</span>
          </div>
          <div class="button-row">
            <button class="button primary" id="generateShapes" type="button">
              Generate shapes
            </button>
            <button class="button" id="clearGenerated" type="button">
              Clear variants
            </button>
          </div>
          <div class="status-row">
            <button class="button" id="selectAll" type="button">
              Select all
            </button>
            <button class="button" id="downloadSelected" type="button" disabled>
              Download selected
            </button>
            <button class="button" id="clearSelection" type="button" disabled>
              Clear selection
            </button>
          </div>
        </div>
      </section>

      <section class="grid" id="grid" aria-label="Extracted blob SVGs"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

          localView.setUint32(22, data.length, true);
          localView.setUint16(26, nameBytes.length, true);
          local.set(nameBytes, 30);
          localParts.push(local, data);

          const central = new Uint8Array(46 + nameBytes.length);
          const centralView = new DataView(central.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(12, time, true);
          centralView.setUint16(14, day, true);
          centralView.setUint32(16, checksum, true);
          centralView.setUint32(20, data.length, true);
          centralView.setUint32(24, data.length, true);
          centralView.setUint16(28, nameBytes.length, true);
          centralView.setUint32(42, offset, true);
          central.set(nameBytes, 46);
          centralParts.push(central);
          offset += local.length + data.length;
        });

        const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
        const end = new Uint8Array(22);
        const endView = new DataView(end.buffer);
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, offset, true);
        return new Blob([...localParts, ...centralParts, end], {
          type: "application/zip",
        });
      }

      function downloadSelected() {
        const items = selectedItems();
        if (items.length === 0) {
          showToast("Select at least one blob first");
          return;
        }

        const files = items.map((item) => {
          const index = itemIndex(item.uid);
          return {
            name: `${safeFileName(item.label)}.svg`,
            content: exportSvgMarkup(item, index),
          };
        });

        if (files.length === 1) {
          downloadBlob(
            files[0].name,
            new Blob([files[0].content], { type: "image/svg+xml" }),
          );
          showToast(`Downloaded ${items[0].label}`);
          return;
        }

        downloadBlob("selected-blobs.zip", zipSelectedFiles(files));
        showToast(`Downloaded ${files.length} SVG files`);
      }

      function clearGeneratedVariants() {
        const generatedUids = new Set(
          state.items.filter((item) => item.generated).map((item) => item.uid),
        );
        state.items = state.items.filter((item) => !item.generated);
        generatedUids.forEach((uid) => state.selected.delete(uid));
        render();
        showToast("Cleared generated variants");
      }

      swatches.innerHTML = palettes
        .map(
          (palette) => `<button class="swatch" type="button" title="${palette.name}" aria-label="${palette.name} palette" data-palette="${palette.name}" style="--swatch-body:${palette.body};--swatch-eye:${palette.eye};--swatch-stage:${palette.stage}">
            <span></span>
          </button>`,
        )
        .join("");

      blobColor.addEventListener("input", (event) => {
        state.body = event.target.value;
        render();
      });
      eyeColor.addEventListener("input", (event) => {
        state.eye = event.target.value;
        render();
      });
      stageColor.addEventListener("input", (event) => {
        state.stage = event.target.value;
        render();
      });
      spectrum.addEventListener("change", (event) => {
        state.spectrum = event.target.checked;
        render();
      });
      document.querySelector(".variants").addEventListener("click", (event) => {
        const button = event.target.closest("[data-variant]");
        if (!button) return;
        state.variant = button.dataset.variant;
        render();
      });
      swatches.addEventListener("click", (event) => {
        const button = event.target.closest("[data-palette]");
        if (!button) return;
        const palette = palettes.find((item) => item.name === button.dataset.palette);
        applyPalette(palette);
      });
      document.querySelector("#randomize").addEventListener("click", () => {
        const palette = palettes[Math.floor(Math.random() * palettes.length)];
        applyPalette(palette);
        if (!state.spectrum) {
          state.body = palette.fills[Math.floor(Math.random() * palette.fills.length)];
          blobColor.value = state.body;
          render();
        }
      });
      document.querySelector("#reset").addEventListener("click", () => {
        Object.assign(state, defaults);
        blobColor.value = defaults.body;
        eyeColor.value = defaults.eye;
        stageColor.value = defaults.stage;
        spectrum.checked = defaults.spectrum;
        render();
      });
      generateShapes.addEventListener("click", generateShapeBatch);
      clearGenerated.addEventListener("click", clearGeneratedVariants);
      selectAllButton.addEventListener("click", () => {
        state.items.forEach((item) => state.selected.add(item.uid));
        render();
      });
      downloadSelectedButton.addEventListener("click", downloadSelected);
      clearSelectionButton.addEventListener("click", () => {
        state.selected.clear();
        render();
      });
      grid.addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-select]");
        if (!checkbox) return;
        setSelected(checkbox.dataset.select, checkbox.checked);
      });
      grid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-copy]");
        if (button) {
          copyBlob(button.dataset.copy);
          return;
        }

        if (event.target.closest("label, input")) return;
        const tile = event.target.closest("[data-uid]");
        if (!tile) return;
        toggleSelected(tile.dataset.uid);
      });

      render();
    </script>
  </body>
</html>
